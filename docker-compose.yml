services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sneakerclean-sqlserver
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SneakerCleanPass123!
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "14333:1433"
    networks:
      - sneakerclean-net

  redis:
    image: redis:alpine
    container_name: sneakerclean-redis
    ports:
      - "6379:6379"
    networks:
      - sneakerclean-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sneakerclean-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark relative 0.7
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sneakerclean-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sneakerclean-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SneakerCleanDb;User Id=sa;Password=SneakerCleanPass123!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - JwtSettings__SecretKey=MinhaChaveSuperSecretaDaPrimeShoecare2026!
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sneakerclean-net

  frontend:
    build:
      context: ../sneakerclean-frontend
      dockerfile: Dockerfile
    container_name: sneakerclean-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - sneakerclean-net

networks:
  sneakerclean-net:
    driver: bridge

volumes:
  sqlserver-data: